name: Daily Data Refresh

# WHY THIS EXISTS:
# Render's free tier wipes any files written while the app is running
# whenever the container restarts (spin-down after inactivity, or any
# redeploy). This means clicking "Fetch Latest Data" in the dashboard
# only has a temporary effect — it works live, but doesn't persist.
#
# This workflow solves that properly: it runs automatically on a
# schedule, re-fetches and re-processes the NIFTY 50 data, and commits
# the updated CSV files back to the repo. Since Render is connected to
# this repo, that commit automatically triggers a redeploy — meaning the
# live site always has genuinely current data baked in, with zero manual
# steps required going forward.
#
# This does NOT retrain the model (that stays a deliberate, manual,
# periodic step via train_model.py — retraining doesn't need to happen
# daily, see backend/src/api.py's refresh-data endpoint comments for the
# same reasoning).

on:
  schedule:
    # Runs at 11:00 UTC = 4:30 PM IST, Monday-Friday only.
    # WHY THIS TIME SPECIFICALLY: NSE (the Indian stock exchange) closes
    # at 3:30 PM IST. Running at 4:30 PM IST gives Yahoo Finance an hour
    # to actually have that day's closing data available. Running too
    # early (e.g. right after midnight, before market even opens) means
    # the fetch finds nothing new, so nothing gets committed — which is
    # exactly the symptom of "the Action ran but nothing changed."
    # "1-5" = Monday through Friday only, since markets are closed on
    # weekends and there's nothing new to fetch then anyway.
    # Cron syntax: minute hour day month day-of-week
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    # This lets you also trigger it manually from the GitHub Actions tab,
    # instead of only waiting for the schedule — useful for testing.

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so this workflow can commit/push back to the repo

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the data pipeline
        run: |
          python backend/src/fetch_from_yahoo.py
          python backend/src/clean_data.py
          python backend/src/feature_engineering.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          # Only commit if something actually changed — avoids empty
          # commits on days the market was closed / data didn't move.
          # The echo statements here exist specifically so you can open
          # this step's log and immediately see which path was taken,
          # instead of having to guess why nothing updated.
          if git diff --staged --quiet; then
            echo "No data changes detected — nothing to commit. (This is expected if the market was closed, or if this ran before new data was available.)"
          else
            git commit -m "Automated daily data refresh"
            git pull --rebase origin main
            git push
            echo "Data changed — committed and pushed successfully."
          fi
